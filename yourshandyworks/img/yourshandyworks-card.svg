<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E0E0E"/>
      <stop offset="100%" style="stop-color:#232323"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8640A;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#E8640A;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#E8640A;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Orange accent bar left -->
  <rect x="0" y="0" width="6" height="600" fill="#E8640A"/>

  <!-- Subtle glow strip -->
  <rect x="0" y="220" width="800" height="160" fill="url(#glow)"/>

  <!-- Grid lines (subtle) -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="600" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="600" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="600" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Orange decorative corner brackets -->
  <polyline points="40,40 40,80 80,80" fill="none" stroke="#E8640A" stroke-width="2" opacity="0.6"/>
  <polyline points="760,40 760,80 720,80" fill="none" stroke="#E8640A" stroke-width="2" opacity="0.6"/>
  <polyline points="40,560 40,520 80,520" fill="none" stroke="#E8640A" stroke-width="2" opacity="0.6"/>
  <polyline points="760,560 760,520 720,520" fill="none" stroke="#E8640A" stroke-width="2" opacity="0.6"/>

  <!-- Small orange dot decorations -->
  <circle cx="100" cy="100" r="3" fill="#E8640A" opacity="0.4"/>
  <circle cx="700" cy="100" r="3" fill="#E8640A" opacity="0.4"/>
  <circle cx="100" cy="500" r="3" fill="#E8640A" opacity="0.4"/>
  <circle cx="700" cy="500" r="3" fill="#E8640A" opacity="0.4"/>

  <!-- Label top -->
  <text x="400" y="200" font-family="'Arial Narrow', Arial, sans-serif" font-size="11" font-weight="700"
    fill="#E8640A" text-anchor="middle" letter-spacing="5" opacity="0.9">CONSTRUCTION · RENOVATION · ST. ALBERT, AB</text>

  <!-- Main wordmark: YOURS -->
  <text x="400" y="300" font-family="'Arial Narrow', Arial, sans-serif" font-size="96" font-weight="900"
    fill="#ffffff" text-anchor="middle" letter-spacing="8">YOURS</text>

  <!-- Sub wordmark: HANDYWORKS -->
  <text x="400" y="355" font-family="'Arial Narrow', Arial, sans-serif" font-size="44" font-weight="700"
    fill="#E8640A" text-anchor="middle" letter-spacing="12">HANDYWORKS</text>

  <!-- Divider line -->
  <line x1="300" y1="385" x2="500" y2="385" stroke="#E8640A" stroke-width="1.5" opacity="0.5"/>

  <!-- Tagline -->
  <text x="400" y="415" font-family="'Arial Narrow', Arial, sans-serif" font-size="13" font-weight="400"
    fill="#aaaaaa" text-anchor="middle" letter-spacing="3">NOBODY DO IT LIKE YOURS!</text>

  <!-- Services line -->
  <text x="400" y="470" font-family="'Arial Narrow', Arial, sans-serif" font-size="10" font-weight="400"
    fill="#555555" text-anchor="middle" letter-spacing="2">PAINTING · RENOVATION · BASEMENT DEVELOPMENT · COMMERCIAL FIT-OUTS</text>
</svg>
